<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Panel</title>
<style>
:root{--blue:#3157e8;--purple:#6d4aff;--teal:#00c9a7;--bg:#f4f6fb;--text:#172033;--muted:#697386;--border:#e4e7ec;--red:#d92d20;--green:#039855}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh}.page{max-width:980px;margin:auto;padding:20px}.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.login-wrap{width:min(560px,100%)}
.brand{text-align:center}.brand h1{margin:0;color:var(--blue);font-size:42px;letter-spacing:2px}.brand h2{margin:0;font-size:21px;letter-spacing:6px}.brand p{color:var(--muted);margin:8px 0 30px}
.card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 1px 2px #00000008}.field{margin:0 0 14px}.field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 7px}.field input,.field select{width:100%;height:52px;border:1px solid #cfd4dc;border-radius:12px;padding:0 14px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3157e81a}
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:800}.btn-primary{background:var(--blue);color:#fff}.btn-teal{background:var(--teal);color:#fff}.btn-ghost{background:#eef2ff;color:var(--blue)}.btn-danger{background:#fff0ef;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}
.header{background:linear-gradient(110deg,var(--blue),var(--purple));color:#fff;border-radius:0 0 28px 28px;padding:22px}.header-inner{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.top h3{margin:0;font-size:21px}.menu{position:relative}.menu>button{background:transparent;color:#fff;font-size:25px;padding:4px 8px}.menu-list{position:absolute;right:0;top:42px;background:#fff;color:var(--text);min-width:170px;border-radius:12px;padding:7px;box-shadow:0 12px 35px #0002;z-index:20}.menu-list button{display:block;width:100%;text-align:left;background:#fff;padding:10px;border-radius:8px}.menu-list button:hover{background:#f2f4f7}.welcome{margin-top:9px;color:#dde5ff;font-size:13px}.username{font-size:27px;font-weight:800;margin-top:2px}.header-stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.small{font-size:12px;color:#dde5ff}.big{font-size:18px;font-weight:800;margin-top:2px}.online{color:#8af0cf}.progress{height:6px;background:#ffffff30;border-radius:10px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:var(--teal);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 0 8px}.stat{height:82px;background:#fff;border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}.stat b{font-size:24px}.stat span{font-size:10px;color:var(--muted);letter-spacing:1px}.section-title{font-size:20px;font-weight:800;margin:15px 0 8px}.list{display:grid;gap:10px;padding-bottom:90px}.account{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px}.account-head{display:flex;gap:12px;align-items:flex-start}.account-title{font-weight:800;font-size:17px}.account-user{font-size:12px;color:var(--muted);margin-top:2px}.status{margin-left:auto;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.running{background:#e9f8f2;color:var(--green)}.stopped{background:#f2f4f7;color:var(--muted)}.account-info{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 4px}.error{font-size:12px;color:var(--red);margin-top:5px}.actions{display:flex;justify-content:flex-end;gap:2px;flex-wrap:wrap;margin-top:7px}.linkbtn{background:transparent;color:var(--blue);font-weight:800;padding:8px}.linkbtn.danger{color:var(--red)}.linkbtn:disabled{color:#aeb4be;cursor:not-allowed}.fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;font-size:28px;box-shadow:0 8px 25px #00c9a744}
.modal-backdrop{position:fixed;inset:0;background:#10182899;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px;border-radius:12px;background:#fff4e5;color:#f79009;font-size:13px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.user-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:10px}.user-head{display:flex;gap:12px}.badge{margin-left:auto;background:#eef2ff;color:var(--blue);padding:7px 10px;border-radius:99px;font-size:12px;font-weight:800}.logs{background:#1e1e1e;color:#b0f0b0;border-radius:12px;min-height:420px;max-height:65vh;overflow:auto;padding:12px;font:12px/1.55 monospace;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:100;max-width:min(92vw,600px);box-shadow:0 8px 25px #0003}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:620px){.page{padding:14px}.header{padding:18px}.header-stats{gap:10px}.stats{gap:6px}.stat{height:76px}.actions{justify-content:flex-start}.fab{right:18px;bottom:18px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const API_BASE='https://avatar.offc.web.id';
const WS_URL='wss://avatar.offc.web.id/ws/logs';
const S={token:localStorage.getItem('token'),username:localStorage.getItem('username')||'',isAdmin:localStorage.getItem('is_admin')==='true',maxAccounts:localStorage.getItem('max_accounts')?Number(localStorage.getItem('max_accounts')):null,accounts:[],poll:null,menu:false};
const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(m){const e=$('toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3500)}
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;const r=await fetch(API_BASE+path,{...opt,headers:h});let d=null;try{d=await r.json()}catch{}if(r.status===401){logout(false);throw Error('Sesi berakhir')}if(!r.ok)throw Error(d?.detail||d?.message||`Request gagal (${r.status})`);return d}
function saveAuth(token,me){S.token=token;S.username=me.username||S.username;S.isAdmin=!!me.is_admin;S.maxAccounts=me.is_admin?null:me.max_accounts;localStorage.setItem('token',token);localStorage.setItem('username',S.username);localStorage.setItem('is_admin',String(S.isAdmin));if(S.maxAccounts==null)localStorage.removeItem('max_accounts');else localStorage.setItem('max_accounts',S.maxAccounts)}
function logout(render=true){clearInterval(S.poll);S.token=null;localStorage.removeItem('token');localStorage.removeItem('username');localStorage.removeItem('is_admin');localStorage.removeItem('max_accounts');if(render)renderLogin()}
function renderLogin(){
$('app').innerHTML=`<div class="login-page"><div class="login-wrap"><div class="brand"><h1>AVATAR</h1><h2>PANEL</h2><p>Control center akun &amp; bot</p></div><div class="card"><form id="loginForm"><div class="field"><label>Username</label><input id="lu" autocomplete="username" required></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn btn-primary full" id="loginBtn">MASUK</button></form></div></div></div>`;
$('loginForm').onsubmit=login;
}
async function login(e){e.preventDefault();const b=$('loginBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span>';try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});if(!r.token)throw Error('Token login tidak ditemukan');const me=await fetch(API_BASE+'/api/me',{headers:{Authorization:'Bearer '+r.token}}).then(async x=>{const d=await x.json();if(!x.ok)throw Error(d?.detail||`Profil gagal (${x.status})`);return d});saveAuth(r.token,me);renderDashboard()}catch(x){toast(x.message||String(x))}finally{b.disabled=false;b.textContent='MASUK'}}
async function loadAccounts(silent=false){try{const me=await api('/api/me');saveAuth(S.token,me);S.accounts=(await api('/api/accounts')).map(a=>a);if($('dash'))drawDashboard()}catch(e){if(!silent)toast(e.message)}}
function fmtUptime(sec){sec=Number(sec)||0;const m=Math.floor(sec/60),h=Math.floor(m/60);return h?`${h}j ${m%60}m`:`${m}m`}
function isRunning(a){return a.status==='running'||a.status==='reconnecting'}
function renderDashboard(){clearInterval(S.poll);$('app').innerHTML=`<div id="dash"></div><button class="fab" onclick="openAddAccount()">+</button>`;drawDashboard();loadAccounts(true);S.poll=setInterval(()=>loadAccounts(true),5000)}
function drawDashboard(){if(!$('dash'))return;const running=S.accounts.filter(isRunning).length,totalFish=S.accounts.reduce((n,a)=>n+(Number(a.fish_caught)||0),0);const max=S.isAdmin||S.maxAccounts==null?null:S.maxAccounts;const pct=max?Math.min(1,S.accounts.length/max)*100:100;
$('dash').innerHTML=`<div class="header"><div class="header-inner"><div class="top"><h3>Avatar Panel</h3><div class="menu"><button onclick="toggleMenu(event)">⋮</button><div id="menuList" class="menu-list hidden"><button onclick="startAll()">Start Semua</button><button onclick="stopAll()">Stop Semua</button>${S.isAdmin?'<button onclick="openUsers()">Kelola User</button>':''}<button onclick="logout()">Keluar</button></div></div></div><div class="welcome">Selamat datang</div><div class="username">${esc(S.username)}</div><div class="header-stats"><div><div class="small">Batas akun</div><div class="big">${S.accounts.length} / ${max==null?'∞':max}</div></div><div><div class="small">Status panel</div><div class="big online">● ONLINE</div></div></div><div class="progress"><i style="width:${pct}%"></i></div></div></div><main class="page"><div class="stats"><div class="stat"><b>${S.accounts.length}</b><span>TOTAL</span></div><div class="stat"><b style="color:var(--green)">${running}</b><span>RUNNING</span></div><div class="stat"><b style="color:var(--blue)">${totalFish}</b><span>IKAN</span></div></div><div class="section-title">Akun kamu</div><div class="list">${S.accounts.length?S.accounts.map(accountCard).join(''):'<div class="card muted" style="text-align:center">Belum ada akun. Tekan + untuk menambahkan.</div>'}</div></main>`}
function accountCard(a){const run=isRunning(a),map=a.current_map_name||a.current_map_hex||'?',area=a.current_area_name||`Area ${a.current_area_id??'?'}`,npc=a.is_npc_map?' [NPC]':'';return `<div class="account"><div class="account-head"><div><div class="account-title">${esc(a.label||a.username)}</div><div class="account-user">@${esc(a.username)}</div></div><div class="status ${run?'running':'stopped'}">● ${esc((a.status||'stopped').toUpperCase())}</div></div><div class="account-info">🎣 ${Number(a.fish_caught)||0} ikan &nbsp;•&nbsp; ${fmtUptime(a.uptime)}<br>📍 ${esc(map)} / ${esc(area)}${npc}</div>${a.last_error?`<div class="error">${esc(a.last_error)}</div>`:''}<div class="actions"><button class="linkbtn" ${run?'disabled':''} onclick="startAcc(${a.id})">START</button><button class="linkbtn" ${run?'':'disabled'} onclick="stopAcc(${a.id})">STOP</button><button class="linkbtn" onclick="openArea(${a.id},'${esc(a.label||a.username).replace(/'/g,'&#39;')}')">PINDAH</button><button class="linkbtn danger" onclick="deleteAcc(${a.id},'${esc(a.label||a.username).replace(/'/g,'&#39;')}')">HAPUS</button></div></div>`}
function toggleMenu(e){e.stopPropagation();$('menuList')?.classList.toggle('hidden')}document.addEventListener('click',()=>{$('menuList')?.classList.add('hidden')});
async function startAcc(id){try{await api(`/api/accounts/${id}/start`,{method:'POST'});await loadAccounts()}catch(e){toast('Gagal start: '+e.message)}}
async function stopAcc(id){try{await api(`/api/accounts/${id}/stop`,{method:'POST'});await loadAccounts()}catch(e){toast('Gagal stop: '+e.message)}}
async function startAll(){try{await api('/api/accounts/start-all',{method:'POST'});await loadAccounts()}catch(e){toast(e.message)}}
async function stopAll(){try{await api('/api/accounts/stop-all',{method:'POST'});await loadAccounts()}catch(e){toast(e.message)}}
function modal(html){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function closeModal(m){m?.remove()}
function openAddAccount(){const m=modal(`<h2>Tambah Akun</h2><p class="muted">Tambahkan akun game ke panel.</p><form id="addAccForm"><div class="field"><label>Label akun</label><input id="al"></div><div class="field"><label>Username akun game</label><input id="au" required></div><div class="field"><label>Password akun game</label><input id="ap" type="password" required></div><div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal(this.closest('.modal-backdrop'))">Batal</button><button class="btn btn-primary">TAMBAH AKUN</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/accounts',{method:'POST',body:JSON.stringify({label:$('al').value.trim(),username:$('au').value.trim(),password:$('ap').value})});closeModal(m);toast('Akun berhasil ditambahkan');await loadAccounts()}catch(x){toast(x.message)}}}
async function deleteAcc(id,label){if(!confirm(`Hapus akun "${label}"?`))return;try{await api(`/api/accounts/${id}`,{method:'DELETE'});await loadAccounts()}catch(e){toast('Gagal hapus: '+e.message)}}
async function openArea(id,label){const m=modal(`<h2>Pindah Area — ${esc(label)}</h2><div id="areaBody"><p class="muted">Memuat...</p></div>`);try{const [maps,areas,current]=await Promise.all([api('/api/maps'),api('/api/areas'),api(`/api/accounts/${id}/area`)]);const ms=maps.maps||[],as=areas.areas||[];m.querySelector('#areaBody').innerHTML=`<div class="muted" style="margin-bottom:18px">Sekarang: ${esc(current.map_name)} / ${esc(current.area_name)}</div><div class="field"><label>Pilih Map</label><select id="mapSel">${ms.map(x=>`<option value="${x.map_id}" ${x.map_id==current.map_id?'selected':''}>${esc(x.name)} (${esc(x.map_id_hex)})</option>`).join('')}</select></div><div class="field"><label>Pilih Area (0–39)</label><select id="areaSel">${as.map(x=>`<option value="${x.area_id}" ${x.area_id==current.area_id?'selected':''}>${esc(x.name)} (${esc(x.area_id_hex)})</option>`).join('')}</select></div><div id="npcNotice" class="notice hidden">Map NPC — bot akan beli/jual di sini (area default)</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal(this.closest('.modal-backdrop'))">Batal</button><button id="moveBtn" class="btn btn-primary">PINDAH SEKARANG</button></div><p class="muted" style="text-align:center;margin-bottom:0">Bot akan pindah SAAT ITU JUGA (bahkan jika sedang mancing).</p>`;const msEl=m.querySelector('#mapSel'),asEl=m.querySelector('#areaSel'),notice=m.querySelector('#npcNotice');const sync=()=>{const npc=Number(msEl.value)===0x0D;asEl.disabled=npc;notice.classList.toggle('hidden',!npc)};msEl.onchange=sync;sync;m.querySelector('#moveBtn').onclick=async()=>{const mapId=Number(msEl.value),areaId=Number(asEl.value);try{const r=await api(`/api/accounts/${id}/pindah`,{method:'POST',body:JSON.stringify({map_id:mapId,...(mapId===0x0D?{}:{area_id:areaId})})});toast(`✅ Pindah ke ${r.map_name} / ${r.area_name}`);closeModal(m);await loadAccounts()}catch(e){toast(e.message)}}}catch(e){m.querySelector('#areaBody').innerHTML=`<div class="error">Gagal muat data: ${esc(e.message)}</div>`}}
function openLogs(id,label){const m=modal(`<h2>Log — ${esc(label)}</h2><div id="logBox" class="logs">[menghubungkan ke server log...]</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeLogs(this.closest('.modal-backdrop'))">TUTUP</button></div>`);const box=m.querySelector('#logBox');let ws,closed=false,retry=0,timer;function add(s){box.textContent+=`\n${s}`;box.scrollTop=box.scrollHeight}function connect(){if(closed)return;try{ws=new WebSocket(`${WS_URL}?token=${encodeURIComponent(S.token)}`);ws.onopen=()=>{retry=0;add('[terhubung]')};ws.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.type==='logs'&&Array.isArray(j.data))j.data.filter(x=>id===-1||x.acc===id).forEach(x=>add(x.msg||''))}catch{}};ws.onerror=()=>{};ws.onclose=()=>{if(closed)return;retry++;const d=Math.min(30000,Math.max(1000,1000*(2**Math.min(retry,5))));add(`[reconnect dalam ${Math.round(d/1000)}s...]`);timer=setTimeout(connect,d)}}catch(e){add('[gagal connect: '+e+']')}}connect();m.querySelector('.modal-actions button').onclick=()=>{closed=true;clearTimeout(timer);try{ws?.close()}catch{};closeModal(m)}}
async function openUsers(){if(!S.isAdmin)return;const m=modal(`<div class="toolbar"><div><h2 style="margin:0">Kelola User</h2><div class="muted">Atur akun maksimum tiap user dan kelola akses panel.</div></div><button class="btn btn-teal" onclick="openAddUser(this.closest('.modal-backdrop'))">+</button></div><div id="usersBody">Memuat...</div>`);await loadUsers(m)}
async function loadUsers(m){try{const users=await api('/api/users');m.querySelector('#usersBody').innerHTML=users.map(u=>`<div class="user-card"><div class="user-head"><div><b>${esc(u.username)}${u.is_admin?' • ADMIN':''}</b><div class="muted">${u.enabled?'● Aktif':'● Nonaktif'}</div></div><div class="badge">${u.account_count} / ${u.max_accounts??'∞'} akun</div></div><div class="actions"><button class="linkbtn" onclick="setLimit('${esc(String(u.id))}','${esc(u.username)}',this.closest('.modal-backdrop'))">ATUR BATAS</button><button class="linkbtn danger" onclick="deleteUser('${esc(String(u.id))}','${esc(u.username)}',this.closest('.modal-backdrop'))">HAPUS</button></div></div>`).join('')||'<div class="muted">Belum ada user.</div>'}catch(e){m.querySelector('#usersBody').innerHTML=`<div class="error">Gagal muat: ${esc(e.message)}</div>`}}
async function setLimit(uid,user,m){const v=prompt(`Batas akun untuk ${user} (1–9999):`);if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<1||n>9999){toast('Batas akun harus 1–9999');return}try{await api(`/api/users/${encodeURIComponent(uid)}`,{method:'PATCH',body:JSON.stringify({max_accounts:n})});await loadUsers(m)}catch(e){toast(e.message)}}
async function deleteUser(uid,user,m){if(!confirm(`Hapus user "${user}" beserta akun bot miliknya?`))return;try{await api(`/api/users/${encodeURIComponent(uid)}`,{method:'DELETE'});await loadUsers(m)}catch(e){toast(e.message)}}
function openAddUser(parent){const m=modal(`<h2>Tambah User</h2><form id="addUserForm"><div class="field"><label>Username</label><input id="uu" required></div><div class="field"><label>Password (minimal 6 karakter)</label><input id="up" type="password" minlength="6" required></div><div class="field"><label>Maksimal akun</label><input id="um" type="number" min="1" max="9999" value="5" required></div><label style="display:flex;gap:8px;align-items:center"><input id="ua" type="checkbox"> Jadikan admin</label><div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal(this.closest('.modal-backdrop'))">Batal</button><button class="btn btn-primary">BUAT USER</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const u=$('uu').value.trim(),p=$('up').value,max=Number($('um').value);if(!u||p.length<6||max<1||max>9999){toast('Data user tidak valid');return}try{await api('/api/users',{method:'POST',body:JSON.stringify({username:u,password:p,is_admin:$('ua').checked,max_accounts:max})});closeModal(m);await loadUsers(parent)}catch(x){toast(x.message)}}}
function boot(){if(S.token){renderDashboard()}else renderLogin()}
boot();
</script>
</body></html>
